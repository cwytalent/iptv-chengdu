name: 自动更新IPTV列表

on:
  schedule:
    - cron: '0 0 * * *'          # 每天 UTC 0 点（北京时间 8 点）
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 生成 M3U8 文件
        run: |
          python script/home.py

      - name: 配置 Git 用户
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 提交更新
        run: |
          if [[ -n $(git status --porcelain --untracked-files=no) ]]; then
            git add home/iptv.m3u8
            git commit -m "自动更新IPTV列表 - $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "没有变化，跳过提交"
          fi
